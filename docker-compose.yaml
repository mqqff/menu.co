services:
  web:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - menuco_storage:/var/www/storage:ro
    networks:
      - menuco
    ports:
      - "8081:80"
    depends_on:
      octane:
        condition: service_healthy

  octane:
    build:
      context: .
      dockerfile: ./docker/octane/Dockerfile
    restart: unless-stopped
    volumes:
      - menuco_storage:/var/www/storage
    environment:
      DB_HOST: mysql
    env_file:
      - .env
    networks:
      - menuco
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy

  php-cli:
    build:
      context: .
      dockerfile: ./docker/php-cli/Dockerfile
    tty: true
    stdin_open: true
    environment:
      DB_HOST: mysql
    env_file:
      - .env
    networks:
      - menuco

  mysql:
    image: mysql:5.7
    restart: unless-stopped
    user: mysql
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - menuco
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  menuco:

volumes:
  mysql_data:
  menuco_storage:
